apply plugin: "java"

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

project.ext.mainClassName = "technology.rocketjump.mountaincore.launcher.DesktopLauncher"
project.ext.assetsDir = new File("../core/assets");

task run(dependsOn: classes, type: JavaExec) {
    main = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
}

task dist(type: Jar) {
    duplicatesStrategy DuplicatesStrategy.INCLUDE
    manifest {
        attributes 'Main-Class': project.mainClassName
    }
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
    archiveName 'mountaincore.jar'
}

dist.dependsOn classes

build.dependsOn dist

// The phone build. The Deephall Android launcher runs this desktop jar on the phone, so it needs a
// variant of mountaincore.jar whose arm64 natives are Android builds, plus the LWJGL jars it loads.
configurations {
    // Android arm64-v8a builds of libgdx.so and libgdx-freetype.so
    phoneNatives { transitive = false }
    // Plain LWJGL 3.3.6 jars (no natives: the launcher brings its own) for lwjgl336/
    phoneLwjgl { transitive = false }
}

dependencies {
    phoneNatives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    phoneNatives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
    ['lwjgl', 'lwjgl-glfw', 'lwjgl-jemalloc', 'lwjgl-openal', 'lwjgl-opengl', 'lwjgl-stb'].each {
        phoneLwjgl "org.lwjgl:$it:3.3.6"
    }
}

// mountaincore.jar without the desktop natives, with the Android arm64 libgdx libraries in place of
// the Linux arm64 ones. They keep the desktop entry names, because that is what LibGDX's
// SharedLibraryLoader asks for on an arm64 "Linux".
task phoneDist(type: Zip, dependsOn: dist) {
    description = 'Builds mountaincore-phone.jar for the Deephall Android launcher'
    group = 'distribution'
    archiveFileName = 'mountaincore-phone.jar'
    destinationDirectory = dist.destinationDirectory
    inputs.files configurations.phoneNatives

    from(zipTree(dist.archiveFile)) {
        exclude 'linux/**', 'macos/**', 'macosarm64/**', 'macosx64/**', 'windows/**'
        exclude 'libgdxarm64.so', 'libgdx-freetypearm64.so'
    }
    from({ configurations.phoneNatives.collect { zipTree(it) } }) {
        include '**/libgdx.so', '**/libgdx-freetype.so'
        eachFile { details ->
            details.path = details.name.replace('.so', 'arm64.so')
        }
        includeEmptyDirs = false
    }
    doLast {
        // Fail rather than ship a jar the phone cannot load.
        def jarFile = outputs.files.singleFile
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            ['libgdxarm64.so', 'libgdx-freetypearm64.so'].each {
                if (zip.getEntry(it) == null) {
                    throw new GradleException("phoneDist: $it is missing from $jarFile")
                }
            }
        }
    }
}

// The game payload the launcher packs into its APK (its packDeephallGame task reads this folder):
// the phone jar as mountaincore.jar, lwjgl336/, mods/, and the few assets/ files the game reads
// directly instead of building them from mods/ at start (main menu art, metadata, the texture
// placeholders, a few definitions, LibGDX's default skin). metadata/checksums.json stays out on purpose: it would tell a fresh install that
// its assets are already built. Point the launcher at it with -PdeephallGameDir=<this folder> or
// DEEPHALL_GAME_DIR.
task phoneGame(type: Sync) {
    description = 'Stages the Deephall game payload for the Android launcher in desktop/build/phone-game'
    group = 'distribution'
    into "$buildDir/phone-game"
    from(phoneDist) {
        rename { 'mountaincore.jar' }
    }
    from(configurations.phoneLwjgl) {
        into 'lwjgl336'
    }
    from('../core/mods') {
        into 'mods'
    }
    from('../core/assets') {
        include 'main_menu/Deephall_Logo.png', 'main_menu/Dwarven Settlement.png'
        include 'metadata/compatibility.json', 'metadata/twitch_bots.txt'
        include 'unmoddable/**'
        include 'definitions/room-edges.json', 'definitions/crafting/productionDefaults.json'
        include 'definitions/types/furnitureCategories.json', 'definitions/types/professions.json'
        include 'ui/libgdx-default/**', 'ui/TwitchGlitchPurple.png'
        into 'assets'
    }
}

eclipse {
    project {
        name = appName + "-desktop"
        linkedResource name: 'assets', type: '2', location: 'PARENT-1-PROJECT_LOC/core/assets'
    }
}

task afterEclipseImport(description: "Post processing after project generation", group: "IDE") {
  doLast {
    def classpath = new XmlParser().parse(file(".classpath"))
    new Node(classpath, "classpathentry", [ kind: 'src', path: 'assets' ]);
    def writer = new FileWriter(file(".classpath"))
    def printer = new XmlNodePrinter(new PrintWriter(writer))
    printer.setPreserveWhitespace(true)
    printer.print(classpath)
  }
}
