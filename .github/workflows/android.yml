# Builds the standalone Deephall Android APK: the game from this branch, the Android launcher
# from the `launcher` branch of this repository, with the game packed inside the APK.
# The APK is uploaded as a workflow artifact only; nothing is published as a GitHub Release.
#
# Signing, as in ValDroid: the release key (udarmolota_release.p12) with the lineage from the old
# AOSP test key in tools/signing/deephall.lineage, so a release installs over the earlier ones
# that the test key signed (key rotation, Android 9+). Repository secrets: SIGNING_KEY_BASE64 (the
# .p12, base64-encoded), SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD.
# Without them the APK comes out unsigned.
name: Deephall Android APK

on:
  workflow_dispatch: {}
  push:
    tags: [ 'v*' ]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NDK_VERSION: 27.3.13750724
      CMAKE_VERSION: 3.22.1
      # A step's `if` cannot read secrets, so whether there is a keystore is worked out here.
      HAS_KEYSTORE: ${{ secrets.SIGNING_KEY_BASE64 != '' }}
    steps:
      - name: Check out the game
        uses: actions/checkout@v4
        with:
          path: game

      - name: Check out the launcher
        uses: actions/checkout@v4
        with:
          ref: launcher
          path: launcher
          submodules: recursive

      - name: Set up JDK 17 (game)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build the phone jar and stage the game payload
        working-directory: game
        run: |
          chmod +x gradlew
          ./gradlew :desktop:phoneGame --stacktrace
          ls -la desktop/build/phone-game desktop/build/phone-game/lwjgl336
          du -sh desktop/build/phone-game

      - name: Set up JDK 21 (launcher)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ] || [ ! -d "$ANDROID_HOME/cmake/$CMAKE_VERSION" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" --install "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"
          fi
          ls "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake"

      - name: Build the release APK
        working-directory: launcher
        env:
          # Gradle builds it unsigned (no RELEASE_* values here); the next step signs it.
          DEEPHALL_GAME_DIR: ${{ github.workspace }}/game/desktop/build/phone-game
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace
          ls -la app/build/outputs/apk/release

      # The release key with the lineage from the old AOSP test key, so this APK installs over any
      # earlier Deephall (rotation from SDK 28). v3 only: the launcher needs Android 11+ anyway.
      - name: Sign the release APK
        working-directory: launcher
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          LINEAGE: ${{ github.workspace }}/game/tools/signing/deephall.lineage
        run: |
          if [ "$HAS_KEYSTORE" != "true" ]; then
            echo "::warning::Signing secrets are missing: the release APK is unsigned"
            exit 0
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          KEY="$RUNNER_TEMP/release.p12"
          echo "$SIGNING_KEY_BASE64" | base64 --decode --ignore-garbage > "$KEY"
          for APK in app/build/outputs/apk/release/*.apk; do
            "$BT/apksigner" sign --ks "$KEY" --ks-type PKCS12 --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --ks-pass env:SIGNING_STORE_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD \
              --lineage "$LINEAGE" --rotation-min-sdk-version 28 \
              --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true "$APK"
            "$BT/apksigner" verify --print-certs --min-sdk-version 30 "$APK"
            # Gradle names an APK it did not sign *-unsigned.apk; it is signed now
            case "$APK" in *-unsigned.apk) mv "$APK" "${APK%-unsigned.apk}.apk" ;; esac
          done
          rm -f "$KEY"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: deephall-apk
          path: launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          # The APK is a zip already; compressing it again only costs time.
          compression-level: 0

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
